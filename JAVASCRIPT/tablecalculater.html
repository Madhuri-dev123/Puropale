<!DOCTYPE html>
<html>
  <head>
          <style>
            .b{
              background-color: green;
              color: white;
              padding: 40px 80px;
              text-align: center;
              border-radius: 30px;
              font-size: 30px;
            }
            .t{
              font-size: 35px;
              align-items: center;
              padding: 35px 65px;
            }
            tr{
              align-items: center;
            }
          </style>
              <script>
                   function Clear(){
                      userdata.value="";
                   }
                   function givenumber(input){
                      userdata.value+=input;
                   }

                   function cal (){
                      var output=eval(document.getElementById("userdata").value);
                      userdata.value=output;
                  }

              </script>
         </head>
               <body style="border: 1px solid; padding: 10px; margin: 1px 10px;">
               <table border="1px solid " cellspacing="5px" cellpadding="5px" align="center"  >
               <caption><h1  style="background-color: cornflowerblue; color: white;align-items: center;  ">SIMPLE CALCULATER</h1></caption>
            <tr>
              <td  bgcolor="pink" colspan="3" align="center"><input type="text" id="userdata" class="t"></td>
              <td><button onclick="Clear()" class="b" >Clear</button></td>
           </tr>
           
           <tr>
            <td><button onclick="givenumber('1')"  class="b">1</button></td>
            <td><button onclick="givenumber('2')"  class="b">2</button></td>
            <td><button onclick="givenumber('3')"  class="b">3</button></td>
            <td><button onclick="givenumber('+')"  class="b">+</button></td>
          </tr>

          <tr>
            <td><button onclick="givenumber('4')"  class="b">4</button></td>
            <td><button onclick="givenumber('5')"  class="b">5</button></td>
            <td><button onclick="givenumber('6')"  class="b">6</button></td>
            <td><button onclick="givenumber('-')"  class="b">-</button></td>
          

          <tr>
            <td><button onclick="givenumber('7')" class="b">7</button></td>
            <td><button onclick="givenumber('8')" class="b">8</button></td>
            <td><button onclick="givenumber('9')"  class="b">9</button></td>
            <td><button onclick="givenumber('*')" class="b">*</button></td>
          </tr>

          <tr>
            <td><button onclick="givenumber('0')" class="b">0</button></td>
            <td><button onclick="givenumber('.')" class="b" >.</button></td>
            <td><button onclick="givenumber('/')" class="b">/</button></td>
            <td><button onclick="cal('=')" class="b" >=</button></td>
          </tr> 

    </table>
  </body>
</html>
