<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #response{
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;

        }
        .productcard{
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            

            border: 1px solid #cccccc;
            border-radius:  10px;
            padding: 10px;
            width: 100%;
            text-align: center;
            box-shadow: 0  2px 5 px rgba(0,0,0,0.1);
        }
        .productcard img{
         width: 100px;
         height: 100px;
         border-radius: 8px;
    }
        .productcard h3{
            margin-bottom: 10px;
            color: red;
        }
     
    </style>

</head>
<body>
 
    <p id="response"></p>
    <script>
        const getData  = async()=>{
        const url = "https://dummyjson.com/products";
        let response = await fetch (url);
        const data = await response.json();
        console.log(data);

        const products = data.products;
        const Containerdata = products.map((element,index)=>{
            return `<div class="productcard">
               <h3> ${index} ${element.title} </h3>
                <img src="${element.images[0]}" alt="${element.title}" width="150"/>
                  ${element.price}  ${element.description}  ${element.rating}
                </div>`;
        })

        const container = document.getElementById("response");
        container.innerHTML = Containerdata;

        };
        getData();
    </script>
</body>
</html>
